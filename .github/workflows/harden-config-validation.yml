name: Harden config validation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/harden-config-validation.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply validation hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web_monitor.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import json\nfrom pathlib import Path', 'import json\nimport math\nfrom pathlib import Path', 1)
          old_url = '''        if parsed_url.scheme not in {"http", "https"} or not parsed_url.netloc:\n            raise ConfigurationError("target_url must be an absolute HTTP(S) URL")\n'''
          new_url = old_url + '''        if parsed_url.username or parsed_url.password:\n            raise ConfigurationError("target_url must not include credentials")\n'''
          if old_url not in text:
              raise SystemExit('target_url validation anchor not found')
          text = text.replace(old_url, new_url, 1)
          old_number = '''def _number(value: object, field_name: str) -> float:\n    try:\n        return float(value)\n    except (TypeError, ValueError) as exc:\n        raise ConfigurationError(f"{field_name} must be a number") from exc\n'''
          new_number = '''def _number(value: object, field_name: str) -> float:\n    if isinstance(value, bool):\n        raise ConfigurationError(f"{field_name} must be a finite number")\n    try:\n        parsed = float(value)\n    except (TypeError, ValueError) as exc:\n        raise ConfigurationError(f"{field_name} must be a finite number") from exc\n    if not math.isfinite(parsed):\n        raise ConfigurationError(f"{field_name} must be a finite number")\n    return parsed\n'''
          if old_number not in text:
              raise SystemExit('numeric validation anchor not found')
          path.write_text(text.replace(old_number, new_number, 1), encoding='utf-8')

          Path('tests/test_config_hardening.py').write_text('''import unittest\n\nfrom web_monitor import ConfigurationError, MonitorConfig\n\n\nclass ConfigHardeningTests(unittest.TestCase):\n    def test_target_url_rejects_embedded_credentials(self):\n        with self.assertRaises(ConfigurationError):\n            MonitorConfig.from_mapping({\n                "target_url": "https://user:secret@example.com/page",\n                "css_selector": "body",\n            })\n\n    def test_numeric_fields_reject_boolean_and_non_finite_values(self):\n        cases = (\n            ("check_interval_seconds", True),\n            ("request_timeout_seconds", "nan"),\n            ("backoff_seconds", "inf"),\n        )\n        for field, value in cases:\n            with self.subTest(field=field, value=value), self.assertRaises(ConfigurationError):\n                MonitorConfig.from_mapping({\n                    "target_url": "https://example.com/",\n                    "css_selector": "body",\n                    field: value,\n                })\n\n        with self.assertRaises(ConfigurationError):\n            MonitorConfig.from_mapping({\n                "target_url": "https://example.com/",\n                "css_selector": "body",\n                "notification": {"timeout_seconds": float("inf")},\n            })\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          Path('.audit-trigger').write_text('config validation hardening applied\n', encoding='utf-8')
          PY

      - name: Commit hardened source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-config-validation.yml
          git add web_monitor.py tests/test_config_hardening.py .audit-trigger
          git commit -m "fix: harden monitor configuration validation"
          git push
