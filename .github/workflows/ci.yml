name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile source
        run: python -m compileall -q main.py web_monitor.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate example configuration
        run: python main.py --config config.example.json --validate-config

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit core dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Audit optional desktop dependencies
        run: python -m pip_audit -r requirements-desktop.txt
