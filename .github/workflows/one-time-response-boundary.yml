name: One-time response boundary hardening

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply response-size boundary and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('web_monitor.py')
          text = path.read_text()

          replacements = [
              (
                  '    request_timeout_seconds: float = 10.0\n    state_file: str = ".webmonitor/state.json"',
                  '    request_timeout_seconds: float = 10.0\n    max_response_bytes: int = 2_000_000\n    state_file: str = ".webmonitor/state.json"',
              ),
              (
                  '        max_attempts = _bounded_int(\n            payload.get("max_attempts", 3), "max_attempts", 1, 10\n        )',
                  '        max_response_bytes = _bounded_int(\n            payload.get("max_response_bytes", 2_000_000),\n            "max_response_bytes",\n            1_024,\n            50_000_000,\n        )\n        max_attempts = _bounded_int(\n            payload.get("max_attempts", 3), "max_attempts", 1, 10\n        )',
              ),
              (
                  '            request_timeout_seconds=request_timeout_seconds,\n            state_file=state_file,',
                  '            request_timeout_seconds=request_timeout_seconds,\n            max_response_bytes=max_response_bytes,\n            state_file=state_file,',
              ),
              (
                  '        shared_attempts = _bounded_int(\n            payload.get("max_attempts", 3), "max_attempts", 1, 10\n        )',
                  '        shared_max_response_bytes = _bounded_int(\n            payload.get("max_response_bytes", 2_000_000),\n            "max_response_bytes",\n            1_024,\n            50_000_000,\n        )\n        shared_attempts = _bounded_int(\n            payload.get("max_attempts", 3), "max_attempts", 1, 10\n        )',
              ),
              (
                  '            merged.setdefault("request_timeout_seconds", shared_timeout)\n            merged.setdefault("max_attempts", shared_attempts)',
                  '            merged.setdefault("request_timeout_seconds", shared_timeout)\n            merged.setdefault("max_response_bytes", shared_max_response_bytes)\n            merged.setdefault("max_attempts", shared_attempts)',
              ),
              (
                  '                    timeout=self.config.request_timeout_seconds,\n                )',
                  '                    timeout=self.config.request_timeout_seconds,\n                    stream=True,\n                )',
              ),
              (
                  '    def fetch_digest(self) -> tuple[str, int]:\n        """Fetch the page, extract configured content, and return its digest."""\n        response = self._request_with_retry()\n\n        soup = BeautifulSoup(response.text, "html.parser")',
                  '''    def _read_limited_response_text(self, response: requests.Response) -> str:\n        """Read a streamed response without allowing unbounded memory growth."""\n        declared_length = response.headers.get("Content-Length")\n        if declared_length:\n            try:\n                if int(declared_length) > self.config.max_response_bytes:\n                    raise MonitorError("HTTP response exceeded configured size limit")\n            except ValueError:\n                pass\n\n        chunks: list[bytes] = []\n        total_bytes = 0\n        try:\n            for chunk in response.iter_content(chunk_size=65_536):\n                if not chunk:\n                    continue\n                total_bytes += len(chunk)\n                if total_bytes > self.config.max_response_bytes:\n                    raise MonitorError("HTTP response exceeded configured size limit")\n                chunks.append(chunk)\n        except requests.RequestException as exc:\n            raise MonitorError("HTTP response body could not be read") from exc\n        finally:\n            response.close()\n\n        encoding = response.encoding or "utf-8"\n        return b"".join(chunks).decode(encoding, errors="replace")\n\n    def fetch_digest(self) -> tuple[str, int]:\n        """Fetch the page, extract configured content, and return its digest."""\n        response = self._request_with_retry()\n        response_text = self._read_limited_response_text(response)\n\n        soup = BeautifulSoup(response_text, "html.parser")''',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one exact match, got {text.count(old)} for: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)

          test_path = Path('tests/test_web_monitor.py')
          tests = test_path.read_text()
          old = '''class FakeResponse:\n    def __init__(self, text: str, status_code: int = 200):\n        self.text = text\n        self.status_code = status_code\n\n    def raise_for_status(self):'''
          new = '''class FakeResponse:\n    def __init__(self, text: str, status_code: int = 200, headers=None):\n        self.text = text\n        self.status_code = status_code\n        self.headers = headers or {}\n        self.encoding = "utf-8"\n\n    def iter_content(self, chunk_size=65536):\n        payload = self.text.encode(self.encoding)\n        for start in range(0, len(payload), chunk_size):\n            yield payload[start : start + chunk_size]\n\n    def close(self):\n        return None\n\n    def raise_for_status(self):'''
          if tests.count(old) != 1:
              raise SystemExit('FakeResponse patch target changed')
          tests = tests.replace(old, new)

          marker = '''    def test_request_timeout_and_user_agent_are_applied(self):\n'''
          addition = '''    def test_oversized_response_is_rejected_before_parsing(self):\n        with tempfile.TemporaryDirectory() as temp_dir:\n            session = FakeSession(\n                [FakeResponse('<div class="item">too large</div>', headers={"Content-Length": "9999"})]\n            )\n            monitor = WebMonitor(\n                self._config(\n                    str(Path(temp_dir) / "state.json"),\n                    max_response_bytes=1024,\n                ),\n                session=session,\n            )\n\n            with self.assertRaises(MonitorError) as context:\n                monitor.check_once()\n\n            self.assertIn("size limit", str(context.exception))\n\n    def test_streamed_response_is_bounded_even_without_content_length(self):\n        with tempfile.TemporaryDirectory() as temp_dir:\n            session = FakeSession([FakeResponse('<div class="item">' + ('x' * 2000) + '</div>')])\n            monitor = WebMonitor(\n                self._config(\n                    str(Path(temp_dir) / "state.json"),\n                    max_response_bytes=1024,\n                ),\n                session=session,\n            )\n\n            with self.assertRaises(MonitorError) as context:\n                monitor.check_once()\n\n            self.assertIn("size limit", str(context.exception))\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit('Test insertion marker changed')
          tests = tests.replace(marker, addition + marker)
          test_path.write_text(tests)

          for config_path in [
              Path('config.example.json'),
              Path('deploy/config.container.example.json'),
              Path('deploy/config.systemd.example.json'),
          ]:
              payload = json.loads(config_path.read_text())
              payload.setdefault('max_response_bytes', 2_000_000)
              config_path.write_text(json.dumps(payload, indent=2) + '\n')

          readme = Path('README.md')
          readme_text = readme.read_text()
          section = '''\n## HTTP response resource boundary\n\nEach target has a configurable `max_response_bytes` limit (default `2000000`). Responses are requested in streaming mode and rejected if the declared or observed body size exceeds that limit. This prevents a monitored endpoint from causing unbounded response buffering before HTML selection and hashing.\n'''
          if '## HTTP response resource boundary' not in readme_text:
              readme_text += section
          readme.write_text(readme_text)
          PY

      - name: Run focused tests
        run: python -m unittest tests.test_web_monitor -v

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-response-boundary.yml

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web_monitor.py tests/test_web_monitor.py config.example.json deploy/config.container.example.json deploy/config.systemd.example.json README.md .github/workflows/one-time-response-boundary.yml
          git commit -m 'security: bound monitored HTTP response size'
          git push
