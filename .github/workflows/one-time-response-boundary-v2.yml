name: One-time response boundary hardening v2

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Reuse asserted migration script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-time-response-boundary.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, '<response-boundary-migration>', 'exec'))
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused tests
        run: python -m unittest discover -s tests -p 'test_web_monitor.py' -v

      - name: Remove one-time workflows
        run: rm .github/workflows/one-time-response-boundary.yml .github/workflows/one-time-response-boundary-v2.yml

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: bound monitored HTTP response size'
          git push
